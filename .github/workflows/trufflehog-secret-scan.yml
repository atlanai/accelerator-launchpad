name: 'TruffleHog Secret Scan'

on:
  push:
    branches:
      - 'main'
      - 'master'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'main'
      - 'master'

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        # Pinned to v3.99.7. Without base/head the action scans the pushed commits on a push
        # and the PR range on a pull request; the template's base=main/head=HEAD made every
        # direct push to main fail with "BASE and HEAD commits are the same".
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          path: ./
          extra_args: --only-verified
